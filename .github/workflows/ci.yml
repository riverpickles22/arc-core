name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: graph tests (date vectors, reports, checks)
        run: npm test
        working-directory: graph

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python requirements
        run: pip install -r requirements.txt

      - name: date vectors (python side of the shared rule)
        run: python3 tools/test_date_vectors.py

      - name: validate the worked example
        run: python3 tools/validate.py examples/example-story
