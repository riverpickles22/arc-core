name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: graph tests (date vectors, reports, checks)
        run: npm test
        working-directory: graph

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python requirements
        run: pip install -r requirements.txt

      - name: date vectors (python side of the shared rule)
        run: python3 tools/test_date_vectors.py

      - name: sentence vectors (python side of the shared rule)
        run: python3 tools/test_sentence_vectors.py

      - name: validate the worked example
        run: python3 tools/validate.py examples/example-story

      - name: provenance registers (negative-tested)
        run: python3 tools/test_provenance.py

      - name: story shape — the files every story owes (negative-tested)
        run: python3 tools/test_story_shape.py

      - name: templates survive being copied into a story
        run: python3 tools/test_templates.py

      - name: story format version (negative-tested)
        run: python3 tools/test_format_version.py

      - name: annotation scope — passage or section (negative-tested)
        run: python3 tools/test_annotation_scope.py

      - name: keypoint shape — what arc instructs must validate (negative-tested)
        run: python3 tools/test_keypoint_shape.py

      - name: new-story builds a conforming story from answers (negative-tested)
        run: python3 tools/test_new_story.py

      - name: STORY-FORMAT.md's mapping table matches the validator
        run: python3 tools/test_story_format.py

      - name: the obligation satisfaction chain (negative-tested)
        run: python3 tools/test_obligations.py
