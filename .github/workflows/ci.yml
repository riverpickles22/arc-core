name: ci

# One test step, the same command the pre-commit hook runs (A70-5): the list
# of what counts as green lives in tools/check.sh and nowhere else. The runner
# needs the venv the templates expect at arc-core/.venv — bin/validate refuses
# to run without it, which is what kept this red from 2026-08-26 to A70-5.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: the venv the check expects
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q -r requirements.txt

      - name: the check — validate, every python suite, the lock guard, the graph
        run: tools/check.sh
